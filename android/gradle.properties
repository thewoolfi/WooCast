org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Репозиторий может лежать в каталоге с кириллицей в пути (например, «Рабочий стол»).
# AGP по умолчанию считает это фатальной ошибкой; для проекта без NDK сборка при этом
# работает штатно (проверено), поэтому проверку отключаем.
android.overridePathCheck=true

kotlin.code.style=official
